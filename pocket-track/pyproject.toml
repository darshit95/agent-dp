[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pockettrack-local"
version = "1.1.0"
description = "PocketTrack: private local-first spending, budgeting, and net-worth tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "argon2-cffi>=23.1,<26",
  "keyring>=25,<26",
  "sqlcipher3>=0.6.2,<0.7",
  "httpx>=0.27,<1",
  "cryptography>=43,<48",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
pockettrack = "cardbudget.cli:main"
cardbudget = "cardbudget.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardbudget = [
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
